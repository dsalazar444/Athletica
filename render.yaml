services:
  - type: web
    name: athletica-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_NAME
        fromDatabase:
          name: athletica-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: athletica-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: athletica-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: athletica-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: athletica-db
          property: port
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Athletica <noreply@athletica.com>

databases:
  - name: athletica-db
    plan: free
    databaseName: users_db
    user: users_django
