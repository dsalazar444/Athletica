# SonarQube / SonarCloud Project Configuration
sonar.projectKey=Athletica
sonar.organization=sahiansalome14
sonar.projectName=Athletica
sonar.projectVersion=1.0

# Solo código de aplicación (Flutter = lib/, no src/)
sonar.sources=backend,frontend/lib

# Tests (no cuentan como código fuente duplicado)
sonar.tests=backend/tests,frontend/test
sonar.test.inclusions=backend/**/tests.py,backend/**/tests/**,frontend/**/*_test.dart

# Sin espacios tras las comas (si no, muchos patrones no aplican)
sonar.exclusions=\
**/.git/**,\
**/node_modules/**,\
**/.venv/**,\
**/venv/**,\
**/env/**,\
**/__pycache__/**,\
**/.dart_tool/**,\
**/.pub/**,\
**/.pub-cache/**,\
**/dist/**,\
**/build/**,\
**/coverage/**,\
**/migrations/**,\
**/android/**,\
**/ios/**,\
**/web/**,\
**/linux/**,\
**/macos/**,\
**/windows/**,\
**/test/**,\
**/tests/**,\
**/*_test.dart,\
**/*.g.dart,\
**/*.freezed.dart,\
**/*.spec.ts,\
**/*.pyc,\
**/assets/**,\
backend/manage.py,\
backend/backend/wsgi.py,\
backend/backend/asgi.py

sonar.coverage.exclusions=frontend/**

# --- Backend (Python) ---
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.sourceEncoding=UTF-8
